<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dikey Çoklu Toplar Kırma Oyunu</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #121216;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 800px;
            background: #1a1a24;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border-left: 2px solid #2a2a3a;
            border-right: 2px solid #2a2a3a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1e1e2f;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .center-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255,204,0,0.5);
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ccc;
        }
        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="header-info">
                <span id="scoreDisplay">Skor: 0</span>
                <span id="highScoreDisplay">Rekor: 0</span>
            </div>
        </div>
        <div id="startScreen" class="center-message">
            <h1>Top Kırma Oyunu</h1>
            <p>Çubuğu fareyle veya telefon ekranına dokunarak kaydır!</p>
            <button class="btn" onclick="startGame()">OYNA</button>
        </div>
        <div id="gameOverScreen" class="center-message" style="display: none;">
            <h1>OYUN BİTTİ</h1>
            <p id="finalScoreText">Skorun: 0</p>
            <button class="btn" onclick="startGame()">TEKRAR OYNA</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Sabit oyun çözünürlüğü
        const WIDTH = 480;
        const HEIGHT = 800;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        let score = 0;
        let highScore = localStorage.getItem('brickGameHighScore') || 0;
        document.getElementById('highScoreDisplay').innerText = "Rekor: " + highScore;

        let gameRunning = false;

        // Paddle (Çubuk)
        let paddle = {
            w: 120,
            h: 16,
            x: WIDTH / 2 - 60,
            y: HEIGHT - 50,
            dx: 0,
            speed: 8
        };

        // Toplar dizisi (Çoklu top desteği)
        let balls = [];

        // Tuğlalar dizisi
        let bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 6;
        const brickWidth = 70;
        const brickHeight = 25;
        const brickPadding = 10;
        const brickOffsetTop = 60;
        const brickOffsetLeft = (WIDTH - (brickColumnCount * (brickWidth + brickPadding) - brickPadding)) / 2;

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let hitsNeeded = r === 0 ? 2 : 1; // Üst sıra 2 vuruş ister
                    bricks.push({
                        x: c * (brickWidth + brickPadding) + brickOffsetLeft,
                        y: r * (brickHeight + brickPadding) + brickOffsetTop,
                        w: brickWidth,
                        h: brickHeight,
                        status: true,
                        hits: hitsNeeded
                    });
                }
            }
        }

        function createBall() {
            return {
                x: paddle.x + paddle.w / 2,
                y: paddle.y - 15,
                r: 8,
                speed: 5,
                dx: (Math.random() - 0.5) * 6,
                dy: -5
            };
        }

        function startGame() {
            score = 0;
            document.getElementById('scoreDisplay').innerText = "Skor: " + score;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            
            paddle.x = WIDTH / 2 - paddle.w / 2;
            balls = [createBall()];
            initBricks();
            gameRunning = true;
        }

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('brickGameHighScore', highScore);
                document.getElementById('highScoreDisplay').innerText = "Rekor: " + highScore;
            }
            document.getElementById('finalScoreText').innerText = "Skorun: " + score;
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        // Klavye Kontrolleri
        let rightPressed = false;
        let leftPressed = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
            if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
            if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
        });

        // Dokunmatik (Telefon / Tablet) Kontrolleri
        function handleTouch(e) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            // Canvas ölçeklendirmesine göre konumu ayarla
            const scaleX = WIDTH / rect.width;
            paddle.x = (touchX * scaleX) - paddle.w / 2;

            // Sınırları kontrol et
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.w > WIDTH) paddle.x = WIDTH - paddle.w;
        }

        window.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const scaleX = WIDTH / rect.width;
            paddle.x = (mouseX * scaleX) - paddle.w / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.w > WIDTH) paddle.x = WIDTH - paddle.w;
        });

        canvas.addEventListener('touchstart', handleTouch, { passive: true });
        canvas.addEventListener('touchmove', handleTouch, { passive: true });

        function update() {
            if (!gameRunning) return;

            // Klavye ile hareket
            if (rightPressed) {
                paddle.x += paddle.speed;
                if (paddle.x + paddle.w > WIDTH) paddle.x = WIDTH - paddle.w;
            } else if (leftPressed) {
                paddle.x -= paddle.speed;
                if (paddle.x < 0) paddle.x = 0;
            }

            // Topları hareket ettir
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.x += b.dx;
                b.y += b.dy;

                // Duvar çarpışmaları
                if (b.x - b.r < 0) { b.x = b.r; b.dx *= -1; }
                if (b.x + b.r > WIDTH) { b.x = WIDTH - b.r; b.dx *= -1; }
                if (b.y - b.r < 0) { b.y = b.r; b.dy *= -1; }

                // Paddle (çubuk) çarpışması
                if (
                    b.y + b.r >= paddle.y &&
                    b.y - b.r <= paddle.y + paddle.h &&
                    b.x >= paddle.x &&
                    b.x <= paddle.x + paddle.w
                ) {
                    let hitPoint = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                    b.dx = hitPoint * 6;
                    b.dy = -Math.abs(b.dy);
                }

                // Tuğla çarpışmaları
                for (let brick of bricks) {
                    if (brick.status) {
                        if (
                            b.x + b.r > brick.x &&
                            b.x - b.r < brick.x + brick.w &&
                            b.y + b.r > brick.y &&
                            b.y - b.r < brick.y + brick.h
                        ) {
                            b.dy *= -1;
                            brick.hits--;
                            if (brick.hits <= 0) {
                                brick.status = false;
                                score += 10;
                                document.getElementById('scoreDisplay').innerText = "Skor: " + score;

                                // Her 100 puanda ekstra top ekle!
                                if (score % 100 === 0) {
                                    balls.push(createBall());
                                }
                            }
                        }
                    }
                }

                // Alt sınıra düşen topu sil
                if (b.y - b.r > HEIGHT) {
                    balls.splice(i, 1);
                }
            }

            // Tüm toplar bittiyse oyun biter
            if (balls.length === 0) {
                gameOver();
            }

            // Tüm tuğlalar bittiyse yeni seviye/tuğla yükle
            if (bricks.every(b => !b.status)) {
                initBricks();
                balls.push(createBall());
            }
        }

        function draw() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Tuğlaları çiz
            for (let brick of bricks) {
                if (brick.status) {
                    ctx.fillStyle = brick.hits > 1 ? '#ffcc00' : '#ff4757';
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
                    ctx.shadowBlur = 0; // Gölgeyi sıfırla
                }
            }

            // Çubuğu çiz
            ctx.fillStyle = '#00d2d3';
            ctx.shadowColor = '#00d2d3';
            ctx.shadowBlur = 10;
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.shadowBlur = 0;

            // Topları çiz
            for (let b of balls) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
